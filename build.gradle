// Top-level build file where you can add configuration options common to all sub-projects/modules.


buildscript {
    ext {

        // 应用版本
        versionCode = 8
        versionName = "0.0.5-3.5.1-open"

        // assists 系列（Maven Central: io.github.ven-coder）
        assistsVersion = "3.5.3"
        mavenGroupId = "io.github.ven-coder"
        assistsxkitVersion = "0.0.2"

        // SDK 版本（与 assists 3.5.0 对齐）
        compileSdk = 36
        minSdk = 24
        targetSdk = 36

        // 依赖库版本
        coreKtxVersion = "1.13.1"
        activityKtxVersion = "1.9.0"
        appcompatVersion = "1.6.1"
        kotlinBomVersion = "2.1.0"
        utilcodexVersion = "1.31.1"
        opencvVersion = "4.9.0"

        // Room（2.6+ 与 Kotlin 2.x / kapt 下 suspend DAO 生成兼容）
        roomVersion = "2.6.1"

        // UI相关
        constraintlayoutVersion = "2.1.4"
        materialVersion = "1.8.0"
        recyclerviewVersion = "1.3.0"
        xpopupVersion = "2.9.17"
        flexboxVersion = "3.0.0"

        // 网络相关
        ok2curlVersion = "0.8.0"
        okgoVersion = "3.0.4"
        okhttpLoggingVersion = "4.10.0"

        // 图片加载
        glideVersion = "4.15.1"

        // Gradle 插件版本（与 settings.gradle pluginManagement 对齐）
        gradleVersion = "8.11.1"
        kotlinGradleVersion = "2.1.0"
    }
    repositories {
        mavenLocal()
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url 'https://repo1.maven.org/maven2/' }
        maven { url 'https://jitpack.io' }
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"

    }
}
allprojects {
    repositories {
        mavenLocal()
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url 'https://repo1.maven.org/maven2/' }
        maven { url 'https://jitpack.io' }
        mavenCentral()
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

tasks.register('publishAllToMavenCentral') {
    group = 'publishing'
    description = 'Publish assistsxkit to Maven Central'
    dependsOn(':assistsxkit:publishToMavenCentral')
}
