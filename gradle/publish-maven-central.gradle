// Maven Central 发布配置（library 模块在 apply 前设置 ext.mavenArtifactId 等）
def artifactId = project.ext.mavenArtifactId
def pomName = project.ext.mavenPomName
def pomDescription = project.ext.mavenPomDescription

mavenPublishing {
    coordinates(rootProject.ext.mavenGroupId, artifactId, rootProject.ext.assistsxkitVersion)

    pom {
        name = pomName
        description = pomDescription
    }
}
